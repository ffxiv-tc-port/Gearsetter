name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release Gearsetter/Gearsetter.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './Gearsetter/dist/Gearsetter/Gearsetter.json'
          $json = Get-Content -Raw -Encoding utf8 $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json -Depth 100 | Set-Content -Path $path -Encoding utf8
      - name: Rename artifact to Gearsetter.zip
        shell: pwsh
        run: |
          # 直接指名輸出路徑,不要用 -Recurse 找 latest.zip:LLib 是 Gearsetter 的
          # ProjectReference,建 Gearsetter.csproj 時它也會產出自己的 latest.zip,
          # 萬用字元搜尋的順序不保證,撿錯一個就會把 LLib 當成 Gearsetter 出貨
          # (而 manifest 那步是寫死路徑的 ⇒ zip 與 json 來自不同外掛,零徵兆)。
          Copy-Item './Gearsetter/dist/Gearsetter/latest.zip' -Destination 'Gearsetter.zip'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Gearsetter.zip
            Gearsetter/dist/Gearsetter/Gearsetter.json
          generate_release_notes: true

