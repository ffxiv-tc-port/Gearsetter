name: Build Check

# 注意：push 底下只給了 tags-ignore，依 GitHub 的篩選規則這代表「只在推 tag 時觸發」，
# 推分支並不會觸發（艦隊裡所有 repo 的 build-check 歷史執行次數都是 0，已實測確認）。
# 這份設定與艦隊其他 44 個 repo 保持一致，要實際跑編譯檢查請用 workflow_dispatch 手動觸發。
on:
  push:
    branches:
      - 'tc-7.20'
    tags-ignore:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Build with dotnet
        run: dotnet build --configuration Release Gearsetter/Gearsetter.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
